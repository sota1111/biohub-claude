[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biohub-tracking"
version = "0.1.0"
description = "Data loader + local Edge/Division Jaccard evaluation for the Biohub cell-tracking Kaggle competition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "zarr>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
biohub-evaluate = "biohub_tracking.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
